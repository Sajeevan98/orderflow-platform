spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/orders/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info